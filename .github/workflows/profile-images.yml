name: generate profile images

on:
  # run once a day at 02:00 UTC
  schedule:
    - cron: "0 2 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the default branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: generate profile images
        run: node scripts/build-card.mjs
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}

      # the images are served from https://raw.githubusercontent.com/<user>/<repo>/output/<file>
      - name: push images to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
